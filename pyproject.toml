[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argumentation-engine"
version = "0.1.0"
description = "Abstract argumentation semantics and strategic argumentation mechanism design."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sreenitya Thatikunta" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["argumentation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
