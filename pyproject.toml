[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argumentation-engine"
version = "0.1.0"
description = "Abstract argumentation semantics and strategic argumentation mechanism design."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sreenitya Thatikunta" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]
experiments = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["argumentation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["argumentation", "experiments"]
warn_unused_ignores = true
